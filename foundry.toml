[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true

# openzeppelin-foundry-upgrades: 升级安全校验（Upgrades.sol）需要 ffi + AST + storage layout
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./out" },
]

# `--rpc-url local` 别名（指向本地 anvil）；sepolia / mainnet 由 .env 的 FOUNDRY_RPC_ENDPOINTS 注入
[rpc_endpoints]
local = "http://127.0.0.1:8545"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
